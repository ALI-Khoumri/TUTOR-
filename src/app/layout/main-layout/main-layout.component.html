<div class="app-shell">
  <app-header (menuToggle)="toggleSidebar()"></app-header>
  <div class="shell-body">
    <div class="sidebar-backdrop" [class.is-visible]="sidebarOpen" (click)="closeSidebar()"></div>
    <app-sidebar [isOpen]="sidebarOpen" (closed)="closeSidebar()"></app-sidebar>
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
